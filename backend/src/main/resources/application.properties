# ===================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR
# ===================================================================
# Puerto donde se ejecutará nuestra API REST (por defecto 8080)
server.port=8080

# Nombre de la aplicación en los registros / logs
spring.application.name=backend

# ===================================================================
# CONFIGURACIÓN DE CONEXIÓN A LA BASE DE DATOS (MYSQL)
# ===================================================================
# URL de conexión JDBC hacia MySQL:
# - tienda -> Nombre de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/tienda?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Credenciales de acceso a MySQL (ajustar si tus credenciales cambian)
spring.datasource.username=root
spring.datasource.password=1234

# Driver de conexión oficial de MySQL para Java
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE (ORM)
# ===================================================================
# Dialecto de SQL: le indica a Hibernate que use la sintaxis específica de MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto=update: Conserva los datos y tablas en MySQL aplicando el esquema LONGTEXT
spring.jpa.hibernate.ddl-auto=update

# Ejecución automática de scripts SQL
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true



# ===================================================================
# CONFIGURACIÓN DE ARCHIVOS SUBIDOS (UPLOADS DE IMÁGENES)
# ===================================================================
# Tamaño máximo permitido por archivo individual (ej: 5MB)
spring.servlet.multipart.max-file-size=5MB

# Tamaño máximo total de la petición HTTP (ej: 10MB)
spring.servlet.multipart.max-request-size=10MB

# Directorio donde se almacenarán físicamente los archivos cargados en el servidor
app.directorio-imagenes=uploads

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT (JSON WEB TOKEN)
# ===================================================================
# Clave Secreta privada para firmar los Tokens (Debe ser una cadena larga y segura en producción)
app.jwt-secret=9af745b1216e25776d6a59b35b6b19a16f2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e

# Tiempo de validez del Token JWT en milisegundos (86400000 ms = 24 Horas)
app.jwt-expiration-milliseconds=86400000
